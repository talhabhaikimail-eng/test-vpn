<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Onic Control</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Icon sprite (lucide-style strokes) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2a10 10 0 0 0 0 20c1 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7h2A5.6 5.6 0 0 0 22 11c0-5-4.5-9-10-9z"/></symbol>
    <symbol id="i-package" viewBox="0 0 24 24"><path d="M16.5 9.4 7.5 4.2M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M8 16H3v5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m6 17 5-5-5-5M13 17l5-5-5-5"/></symbol>
  </defs>
</svg>

<div id="login" class="login hidden">
  <div class="topright"><button class="icon-btn" data-theme-toggle title="Toggle theme"><svg class="ic"><use href="#i-sun"/></svg></button></div>
  <form id="loginForm" class="card login-card">
    <div class="logo lg">O</div>
    <div>
      <h1>Sign in to Onic</h1>
      <p class="muted">Manage servers, accounts and app releases</p>
    </div>
    <label>Username<input name="username" autocomplete="username" placeholder="Enter username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
    <label>Authenticator code<input name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" required></label>
    <p id="loginErr" class="alert hidden"></p>
    <button class="primary block" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="shell hidden">
  <header class="topbar">
    <div class="row">
      <div class="logo">O</div>
      <span class="brand">Onic</span>
      <span class="badge live"><span class="pulse"></span>Live</span>
    </div>
    <div class="row gap6">
      <span class="who muted" id="who"></span>
      <button class="icon-btn" id="refresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" data-theme-toggle title="Toggle theme"><svg class="ic"><use href="#i-sun"/></svg></button>
      <button class="outline sm" id="logout" title="Sign out"><svg class="ic"><use href="#i-logout"/></svg><span class="md-only">Sign out</span></button>
      <button class="icon-btn outline mobile-only" id="menuBtn" title="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="sidebar" id="sidebar">
      <div class="nav" id="tabs"></div>
      <div class="sidebar-foot">
        <div class="session-card" id="sessionCard"><p>Signing key</p><b class="mono" id="kidLabel">—</b></div>
        <button class="nav-item" id="collapse"><svg class="ic"><use href="#i-left"/></svg><span>Collapse menu</span></button>
      </div>
    </nav>

    <main class="content">
      <div class="page">
        <div class="page-head">
          <p class="crumb">Onic<span>/</span><span id="crumbCat"></span></p>
          <h2 class="page-title"><svg class="ic primary-ic" id="titleIcon"><use href="#i-dash"/></svg><span id="titleText">Dashboard</span></h2>
        </div>
        <div id="main" class="fade-in"></div>
      </div>
    </main>
  </div>
</div>

<div id="drawer" class="drawer hidden">
  <nav class="drawer-panel">
    <div class="row spread"><h3>Navigation</h3><button class="icon-btn" id="drawerClose"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="nav" id="tabsMobile"></div>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="card" id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
