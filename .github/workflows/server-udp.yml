name: Server Mux 2 - Failover Node
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'live_domain*.txt'
      - 'README.md'
      - '.ai/**'
  schedule:
    # Every 6 hours at 04:00, 10:00, 16:00, 22:00 UTC — offset 3h from the primary
    # V2Ray/mux node (01,07,13,19) so the two mux nodes never restart together.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration to keep tunnel alive in minutes (default: 345 = 5h 45m)'
        required: false
        default: '345'
        type: string
      cf_protocol:
        description: 'cloudflared transport: http2 (stable WebSockets, required for /mux), quic, or auto'
        required: false
        default: 'http2'
        type: choice
        options:
          - http2
          - quic
          - auto

permissions:
  contents: write
  actions: write

jobs:
  # ── Schedule guard: cron is only a safety net, never restart a live node ──
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Skip scheduled run if a Mux 2 node is already live
        id: check
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OTHERS=$(gh run list -R "${{ github.repository }}" --workflow server-udp.yml -L 20 \
              --json databaseId,status -q '[.[] | select((.status=="in_progress" or .status=="queued") and .databaseId != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
            if [ "${OTHERS:-0}" -gt 0 ]; then
              echo "A Mux 2 run is already active/queued ($OTHERS); scheduled run will not interrupt it."
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  server-mux2:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_UDP }}
      CF_PROTOCOL: ${{ github.event.inputs.cf_protocol || 'http2' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Install Cloudflared ─────────────────────────────────────────────────
      - name: Install Cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          # Default transport is http2: the /mux path is a WebSocket upgrade, which
          # stalled intermittently over QUIC from the ISB edge (same as the V2Ray node).
          cat > "$RUNNER_TEMP/cf.sh" <<'EOF'
          start_cf() {
            pkill -f "cloudflared tunnel" 2>/dev/null || true
            sleep 1
            nohup cloudflared tunnel --no-autoupdate --protocol "$CF_PROTOCOL" --metrics 127.0.0.1:20242 \
              run --token "$CF_TOKEN" >> cf_tunnel.log 2>&1 &
          }
          cf_ready() { curl -fsS -m 3 http://127.0.0.1:20242/ready > /dev/null 2>&1; }
          wait_cf_ready() {
            for _ in $(seq 1 "${1:-45}"); do cf_ready && return 0; sleep 1; done
            return 1
          }
          EOF

      # ── TCP tuning ──────────────────────────────────────────────────────────
      - name: Tune TCP Stack (BDP Optimized)
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          sudo sysctl -w net.ipv4.tcp_rmem="4096 2097152 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 2097152 16777216"
          sudo modprobe tcp_bbr 2>/dev/null || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.ipv4.tcp_notsent_lowat=16384
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0
          sudo sysctl -w net.ipv4.tcp_mtu_probing=1
          echo "BBR: $(cat /proc/sys/net/ipv4/tcp_congestion_control)"

      # ── Build & Start the mux node (proxy_v2ray /mux only, no Xray) ──────────
      - name: Build & Start Mux Node
        env:
          MUX_PSK: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo fuser -k 80/tcp 2>/dev/null || true
          SRCS="proxy_v2ray.go muxproto.go muxserver.go"
          [ -f quickack_linux.go ] && SRCS="$SRCS quickack_linux.go"
          go build -o proxy_mux_bin $SRCS

          if [ -z "${MUX_PSK:-}" ]; then
            echo "ERROR: SSH_PASSWORD secret (mux pre-shared key) is not set."; exit 1
          fi
          sudo mkdir -p /etc/v2ray
          printf '%s' "$MUX_PSK" | sudo tee /etc/v2ray/mux.key > /dev/null
          sudo chmod 600 /etc/v2ray/mux.key

          # Xray inbounds disabled (empty): this node serves only /mux and /health.
          sudo nohup ./proxy_mux_bin --listen 0.0.0.0:80 --vless "" --vmess "" --xhttp "" \
            --mux-key-file /etc/v2ray/mux.key --name "Mux Node 2" > /var/log/proxy_mux.log 2>&1 &

          for _ in $(seq 1 10); do
            curl -fsS -m 3 http://127.0.0.1:80/health && break
            sleep 1
          done
          curl -fsS -m 3 http://127.0.0.1:80/health > /dev/null || { echo "mux node not healthy"; sudo tail -40 /var/log/proxy_mux.log; exit 1; }
          grep -q "/mux session protocol enabled" /var/log/proxy_mux.log || { echo "mux not enabled (key missing?)"; sudo tail -40 /var/log/proxy_mux.log; exit 1; }
          echo "Mux Node 2 healthy on :80"

      # ── Cloudflare Tunnel ───────────────────────────────────────────────────
      - name: Start Cloudflare Tunnel
        run: |
          . "$RUNNER_TEMP/cf.sh"
          if [ -z "$CF_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN_UDP secret is not set."; exit 1
          fi
          start_cf
          if ! wait_cf_ready 60; then
            echo "cloudflared never became ready:"; tail -50 cf_tunnel.log; exit 1
          fi
          echo "cloudflared ready: $(grep -c 'Registered tunnel connection' cf_tunnel.log) edge connection(s)"

          DOMAIN="${{ secrets.CUSTOM_DOMAIN_UDP }}"
          [ -z "$DOMAIN" ] && DOMAIN="tunnel-udp.ufone-claim.site"
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          echo "$DOMAIN" > live_domain_udp.txt
          git add live_domain_udp.txt
          git commit -m "chore: update mux 2 live domain ($DOMAIN) [skip ci]" || true
          git push origin main || true

      - name: Tunnel Ready
        run: echo "Mux Node 2 live on ${{ env.DOMAIN }} (path /mux)"

      # ── Concurrency Guard: cancel older runs only after this one is ready ────
      - name: Cancel Older Runs of Mux 2 Workflow
        run: |
          THIS_RUN="${{ github.run_id }}"
          WORKFLOW="server-udp.yml"
          sleep 10
          RUNS=$(gh run list --workflow "$WORKFLOW" -s in_progress -L 30 --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          for R in $RUNS; do
            if [ "$R" -lt "$THIS_RUN" ]; then
              echo "Cancelling older Mux 2 run $R..."
              gh run cancel "$R" || true
            fi
          done

      # ── Keep Alive & Process Watchdog ───────────────────────────────────────
      - name: Keep Alive & Process Watchdog
        env:
          MUX_PSK: ${{ secrets.SSH_PASSWORD }}
        run: |
          . "$RUNNER_TEMP/cf.sh"
          THIS_WORKFLOW="server-udp.yml"
          TARGET_DURATION=${{ github.event.inputs.duration_minutes || 345 }}
          TOTAL_SECONDS=$((TARGET_DURATION * 60))
          INTERVAL=15
          ELAPSED=0
          CF_FAILS=0
          PROXY_FAILS=0

          start_proxy() {
            sudo pkill -f "proxy_mux_bin" 2>/dev/null || true
            sudo nohup ./proxy_mux_bin --listen 0.0.0.0:80 --vless "" --vmess "" --xhttp "" \
              --mux-key-file /etc/v2ray/mux.key --name "Mux Node 2" > /var/log/proxy_mux.log 2>&1 &
          }

          echo "Mux Node 2 running for $TARGET_DURATION minutes ($TOTAL_SECONDS s)."

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            if curl -fsS -m 3 http://127.0.0.1:80/health > /dev/null 2>&1; then
              PROXY_FAILS=0
            else
              PROXY_FAILS=$((PROXY_FAILS + 1))
              echo "[WATCHDOG] mux node health check failed ($PROXY_FAILS/2)"
            fi
            if ! pgrep -f "proxy_mux_bin" > /dev/null || [ $PROXY_FAILS -ge 2 ]; then
              echo "[WATCHDOG] Restarting proxy_mux_bin..."
              start_proxy
              PROXY_FAILS=0
            fi

            if cf_ready; then
              CF_FAILS=0
            else
              CF_FAILS=$((CF_FAILS + 1))
              echo "[WATCHDOG] cloudflared not ready ($CF_FAILS/3)"
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null || [ $CF_FAILS -ge 3 ]; then
              echo "[WATCHDOG] Restarting cloudflared..."
              tail -20 cf_tunnel.log || true
              start_cf
              wait_cf_ready 30 && echo "[WATCHDOG] cloudflared ready again" || echo "[WATCHDOG] cloudflared still not ready"
              CF_FAILS=0
            fi
          done

          # Seamless hand-off: start the replacement, keep serving until it cancels us.
          echo "[LIFECYCLE] Mux Node 2 reached end of shift ($TARGET_DURATION m). Initiating hand-off..."
          OTHERS=$(gh run list --workflow "$THIS_WORKFLOW" -L 20 --json databaseId,status \
            -q '[.[] | select((.status=="in_progress" or .status=="queued") and .databaseId != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
          if [ "${OTHERS:-0}" -eq 0 ]; then
            echo "[LIFECYCLE] Dispatching replacement run of Mux 2 (345m shift)..."
            gh workflow run "$THIS_WORKFLOW" -f duration_minutes=345 -f cf_protocol="$CF_PROTOCOL" || true
          fi
          echo "[LIFECYCLE] Serving until the replacement takes over (max 8m)..."
          sleep 480
          echo "Mux Node 2 shift ended cleanly."
