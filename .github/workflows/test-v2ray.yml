name: Test SSH + WebSocket Setup
on:
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to keep tunnel alive in hours (1-6)'
        required: true
        default: '6'
        type: string
      custom_domain:
        description: 'Cloudflare Public Hostname — leave blank for trycloudflare.com'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Install tools ───────────────────────────────────────────────────────
      - name: Install Cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      # ── SSH Server ──────────────────────────────────────────────────────────
      - name: Setup OpenSSH Server
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -z "$SSH_PASS" ]; then
            echo "ERROR: SSH_PASSWORD secret is not set."
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y openssh-server

          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitTunnel.*/PermitTunnel yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*TCPKeepAlive.*/TCPKeepAlive yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveInterval.*/ClientAliveInterval 15/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveCountMax.*/ClientAliveCountMax 10/' /etc/ssh/sshd_config

          sudo mkdir -p /etc/ssh/sshd_config.d
          printf '%s\n' \
            'PasswordAuthentication yes' \
            'AllowTcpForwarding yes' \
            'GatewayPorts yes' \
            'PermitTunnel yes' \
            'TCPKeepAlive yes' \
            'ClientAliveInterval 15' \
            'ClientAliveCountMax 10' \
            'UseDNS no' \
            'GSSAPIAuthentication no' \
            'Compression no' \
            'MaxStartups 100:30:200' \
            | sudo tee /etc/ssh/sshd_config.d/99-custom.conf > /dev/null

          # All times in Asia/Karachi (PKT = UTC+5)
          START_TIME=$(TZ='Asia/Karachi' date '+%d %b %Y %H:%M PKT')
          SHUTDOWN_TIME=$(TZ='Asia/Karachi' date -d '+6 hours' '+%d %b %Y %H:%M PKT')

          # Write SSH pre-auth banner (plain ASCII) + ANSI MOTD via external script.
          # Keeps YAML clean — no pipe characters or escape codes inside the workflow.
          sudo python3 write_banners.py "$START_TIME" "$SHUTDOWN_TIME"
          echo 'Banner /etc/ssh/banner' | sudo tee -a /etc/ssh/sshd_config.d/99-custom.conf > /dev/null

          sudo systemctl restart ssh || sudo service ssh restart

          SSH_USER="vpnuser"
          sudo useradd -m -s /bin/bash "$SSH_USER" 2>/dev/null || true
          echo "$SSH_USER:$SSH_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USER"
          echo "SSH user created."

      # ── TCP tuning ──────────────────────────────────────────────────────────
      - name: Tune TCP Stack (BDP Optimized for High-Latency Links)
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          sudo sysctl -w net.ipv4.tcp_rmem="4096 2097152 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 2097152 16777216"
          sudo modprobe tcp_bbr 2>/dev/null || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.ipv4.tcp_low_latency=1 || true
          sudo sysctl -w net.core.netdev_max_backlog=5000
          sudo sysctl -w net.core.somaxconn=4096
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0
          echo "BBR: $(cat /proc/sys/net/ipv4/tcp_congestion_control)"

      # ── WebSocket proxy ─────────────────────────────────────────────────────
      - name: Start WebSocket Bridge (Go Zero-Copy Proxy)
        run: |
          sudo fuser -k 80/tcp 2>/dev/null || true
          if command -v go &>/dev/null && [ -f proxy.go ]; then
            go build -o proxy_bin proxy.go
            sudo ./proxy_bin --listen 0.0.0.0:80 --target 127.0.0.1:22 > /dev/null 2>&1 &
          else
            chmod +x proxy.py
            sudo python3 proxy.py 80 22 > /dev/null 2>&1 &
          fi
          sleep 2
          sudo ss -tulpn | grep ':80' || true

      # ── Cloudflare tunnel ───────────────────────────────────────────────────
      - name: Start Cloudflare Tunnel
        run: |
          CF_TOKEN="${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
          if [ -n "$CF_TOKEN" ]; then
            cloudflared tunnel run --token "$CF_TOKEN" > /dev/null 2>&1 &
            sleep 8
            CUSTOM="${{ secrets.CUSTOM_DOMAIN }}"
            DOMAIN="${CUSTOM:-your-configured-cloudflare-domain}"
            echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          else
            cloudflared tunnel --url http://127.0.0.1:80 > cf_tunnel.log 2>&1 &
            for i in $(seq 1 30); do
              CF_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cf_tunnel.log | head -n 1)
              [ -n "$CF_URL" ] && break
              sleep 1
            done
            if [ -z "$CF_URL" ]; then
              echo "Failed to obtain trycloudflare URL"; exit 1
            fi
            DOMAIN=$(echo "$CF_URL" | sed 's|https://||')
            echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "$DOMAIN" > live_domain.txt
            git add live_domain.txt
            git commit -m "chore: update live domain [skip ci]" || true
            git push origin main || true
          fi

      - name: Tunnel Ready
        run: echo "Tunnel live on ${{ env.DOMAIN }}"

      # ── Concurrency guard ───────────────────────────────────────────────────
      # Runs AFTER this tunnel is fully live — old run dies only once new one
      # is confirmed connected. Zero downtime during the 6h handoff.
      - name: Cancel Older Runs (new tunnel is live, kill the old one)
        run: |
          REPO="${{ github.repository }}"
          THIS_RUN="${{ github.run_id }}"
          WORKFLOW="test-v2ray.yml"

          echo "This run: $THIS_RUN — cancelling all other in_progress runs..."

          RUNS=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?status=in_progress&per_page=50" \
            --jq '.workflow_runs[] | select(.status=="in_progress") | .id')

          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "$THIS_RUN" ]; then
              echo "Cancelling old run $RUN_ID..."
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
            fi
          done
          echo "Done. Old runs cancelled."

      # ── Keep alive + self-restart ────────────────────────────────────────────
      # Sleep 5h50m, then trigger a fresh run if none is already queued/running.
      # This keeps the tunnel perpetually alive with zero manual intervention.
      - name: Keep Alive + Auto-Restart
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="test-v2ray.yml"

          echo "Sleeping 5h 50m before scheduling restart check..."
          sleep 21000  # 5 hours 50 minutes = 21000 seconds

          echo "Checking for already-running or queued runs..."
          ACTIVE=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')

          echo "Active/queued runs found: $ACTIVE"

          if [ "$ACTIVE" -ge 2 ]; then
            echo "A replacement run is already running/queued — skipping trigger."
          else
            echo "No replacement queued — triggering a new run..."
            gh api -X POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" \
              -f ref=main \
              -f 'inputs[duration_hours]=6'
            echo "New run triggered successfully."
          fi

          echo "Sleeping remaining 10 minutes..."
          sleep 600
