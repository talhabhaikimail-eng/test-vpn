name: Test V2Ray Setup
on:
  push:
  workflow_dispatch:
jobs:
  test-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone V2Ray Repository
        run: |
          git clone https://github.com/SanariSan/v2ray-ws-tls.git
          
      - name: Install Ngrok
        run: |
          # Fixed the download link to fetch the actual Linux Ngrok binary
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin
          
      - name: Authenticate Ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
      - name: Start Ngrok Tunnel
        run: |
          # Start tunnel on port 80 with designated domain
          ngrok http 80 --domain=wand-dedicate-output.ngrok-free.dev --log=stdout > ngrok.log &
          sleep 5
          
          # Extract the assigned public domain name
          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          DOMAIN=$(echo "$TUNNEL_URL" | sed -e 's|^[^/]*//||')
          if [ -z "$DOMAIN" ] || [ "$DOMAIN" = "null" ]; then
            DOMAIN="wand-dedicate-output.ngrok-free.dev"
            TUNNEL_URL="https://$DOMAIN"
          fi
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          
      - name: Configure and Start Containers
        run: |
          cd v2ray-ws-tls
          
          # Generate a valid UUID natively in Ubuntu
          TEST_UUID=$(cat /proc/sys/kernel/random/uuid)
          V2_PATH="/v2ray"
          echo "TEST_UUID=$TEST_UUID" >> $GITHUB_ENV
          echo "V2_PATH=$V2_PATH" >> $GITHUB_ENV
          
          # Patch Dockerfile to use debian:bookworm avoiding Bullseye EOL archive issues
          sed -i 's/FROM debian:bullseye/FROM debian:bookworm/g' container/Dockerfile
          
          # Build V2Ray image
          docker build -t nginx-v2ray ./container
          
          # Create required mount folders
          mkdir -p log client
          
          # Start nginx-v2ray container on port 80 (Ngrok tunnels to port 80)
          docker run --name nginx-v2ray -d \
            -p 80:80 \
            -v "$(pwd)/log:/log" \
            -v "$(pwd)/client:/client" \
            -e "DOMAIN=${DOMAIN}" \
            -e "V2_PATH=${V2_PATH}" \
            -e "V2_PORT=10000" \
            -e "UUIDS=${TEST_UUID}" \
            -e "REDIR_URL=https://bing.com" \
            -e "ALTER_ID=0" \
            nginx-v2ray
          
          # Check container status
          sleep 3
          docker ps
          
      - name: Output Client Config Details
        run: |
          echo "========================================"
          echo "V2Ray is running for 10 minutes!"
          echo "Address: ${{ env.DOMAIN }}"
          echo "Port: 443"
          echo "UUID: ${{ env.TEST_UUID }}"
          echo "Path: ${{ env.V2_PATH }}"
          echo "Network: ws (WebSocket)"
          echo "TLS: Enabled (tls)"
          echo "========================================"
          echo "CRITICAL: To bypass the Ngrok warning screen, you MUST add this"
          echo "custom header in your client's WebSocket (ws) settings:"
          echo ""
          echo "ngrok-skip-browser-warning: 1"
          echo "========================================"
          echo ""
          echo "Client configuration JSON (v2ray-ws-tls/client/config.json):"
          cat v2ray-ws-tls/client/config.json 2>/dev/null || true
          echo ""
          echo "========================================"
          echo "VMess Share Link:"
          VMESS_JSON="{\"v\":\"2\",\"ps\":\"v2ray-ngrok\",\"add\":\"${DOMAIN}\",\"port\":\"443\",\"id\":\"${TEST_UUID}\",\"aid\":\"0\",\"scy\":\"auto\",\"net\":\"ws\",\"type\":\"none\",\"host\":\"${DOMAIN}\",\"path\":\"${V2_PATH}\",\"tls\":\"tls\",\"sni\":\"${DOMAIN}\"}"
          echo -n "$VMESS_JSON" | base64 | tr -d '\n' | sed 's/^/vmess:\/\//'
          echo ""
          echo "========================================"
          
      - name: Keep Alive (10 Minutes)
        run: |
          echo "Waiting 10 minutes before shutting down..."
          sleep 600
