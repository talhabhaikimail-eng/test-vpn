name: Test SSH + WebSocket Setup
on:
  push:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to keep tunnel alive in hours (1-6)'
        required: true
        default: '6'
        type: string
      ssh_password:
        description: 'Password for SSH user (vpnuser)'
        required: false
        default: 'VpnPass1234!'
        type: string

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ngrok
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin

      - name: Authenticate Ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Setup OpenSSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Configure OpenSSH daemon
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitTunnel.*/PermitTunnel yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*TCPKeepAlive.*/TCPKeepAlive yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveInterval.*/ClientAliveInterval 30/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveCountMax.*/ClientAliveCountMax 10/' /etc/ssh/sshd_config

          # Configure sshd_config.d overrides
          sudo mkdir -p /etc/ssh/sshd_config.d
          echo -e "PasswordAuthentication yes\nAllowTcpForwarding yes\nGatewayPorts yes\nPermitTunnel yes" | sudo tee /etc/ssh/sshd_config.d/99-custom.conf

          # Restart OpenSSH service
          sudo systemctl restart ssh || sudo service ssh restart

          # Create VPN SSH User
          SSH_USER="vpnuser"
          SSH_PASS="${{ github.event.inputs.ssh_password || 'VpnPass1234!' }}"
          sudo useradd -m -s /bin/bash "$SSH_USER" 2>/dev/null || true
          echo "$SSH_USER:$SSH_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USER"
          echo "SSH user '$SSH_USER' created successfully."

      - name: Start WebSocket Bridge (WS-ePRO Python Proxy)
        run: |
          # Kill anything on port 80
          sudo fuser -k 80/tcp 2>/dev/null || true

          # Start proxy.py bridging port 80 (HTTP 101 raw stream) to 127.0.0.1:22 (SSH)
          chmod +x proxy.py
          sudo python3 proxy.py 80 22 > proxy.log 2>&1 &
          sleep 2

          # Verify listener
          sudo ss -tulpn | grep 80 || netstat -tlpn | grep 80

      - name: Start Ngrok Tunnel
        run: |
          ngrok http 80 --domain=wand-dedicate-output.ngrok-free.dev --log=stdout > ngrok.log &
          sleep 5

          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          DOMAIN=$(echo "$TUNNEL_URL" | sed -e 's|^[^/]*//||')
          if [ -z "$DOMAIN" ] || [ "$DOMAIN" = "null" ]; then
            DOMAIN="wand-dedicate-output.ngrok-free.dev"
            TUNNEL_URL="https://$DOMAIN"
          fi
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

      - name: Output Client Config Details
        run: |
          SSH_PASS="${{ github.event.inputs.ssh_password || 'VpnPass1234!' }}"
          echo "========================================"
          echo "SSH + WebSocket Tunnel is LIVE!"
          echo "========================================"
          echo "SSH Host: ${{ env.DOMAIN }}"
          echo "SSH Port: 443"
          echo "SSL/TLS: Enabled (tls)"
          echo "SNI: ${{ env.DOMAIN }}"
          echo "Username: vpnuser"
          echo "Password: $SSH_PASS"
          echo "========================================"
          echo "NetMod Configuration:"
          echo "Mode: SSH"
          echo "Connection Type: SSH + SSL (TLS) / SSH + WS"
          echo "Host / SNI: ${{ env.DOMAIN }}"
          echo "Port: 443"
          echo "========================================"
          echo "NetMod Payload:"
          echo "GET / HTTP/1.1[crlf]Host: ${{ env.DOMAIN }}[crlf]ngrok-skip-browser-warning: 1[crlf]Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]"
          echo "========================================"

      - name: Keep Alive
        run: |
          HOURS="${{ github.event.inputs.duration_hours || '6' }}"
          SECONDS=$(( HOURS * 3600 ))
          if [ $SECONDS -gt 21600 ] || [ $SECONDS -le 0 ]; then
            SECONDS=21600
          fi
          echo "Waiting $HOURS hours ($SECONDS seconds) before shutting down..."
          sleep $SECONDS
