name: Test SSH + WebSocket Setup
on:
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to keep tunnel alive in hours (1-6)'
        required: true
        default: '6'
        type: string
      ssh_password:
        description: 'Password for SSH user (vpnuser)'
        required: false
        default: 'VpnPass1234!'
        type: string
      custom_domain:
        description: 'Your Cloudflare Public Hostname (e.g. ssh.yourdomain.com)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Optimize Linux Network Stack (TCP BBR & FastOpen)
        run: |
          # Enable BBR congestion control and FQ queue discipline
          sudo modprobe tcp_bbr 2>/dev/null || true
          echo "tcp_bbr" | sudo tee -a /etc/modules-load.d/bbr.conf 2>/dev/null || true

          # Apply low-latency and bufferbloat mitigation sysctl settings
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0
          sudo sysctl -w net.ipv4.tcp_notsent_lowat=16384
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216

      - name: Setup OpenSSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Configure OpenSSH daemon
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitTunnel.*/PermitTunnel yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*TCPKeepAlive.*/TCPKeepAlive yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveInterval.*/ClientAliveInterval 15/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveCountMax.*/ClientAliveCountMax 10/' /etc/ssh/sshd_config

          # Configure sshd_config.d overrides (Low latency: UseDNS no, Compression no, IPQoS none)
          sudo mkdir -p /etc/ssh/sshd_config.d
          cat << 'EOF' | sudo tee /etc/ssh/sshd_config.d/99-custom.conf
          PasswordAuthentication yes
          AllowTcpForwarding yes
          GatewayPorts yes
          PermitTunnel yes
          TCPKeepAlive yes
          ClientAliveInterval 15
          ClientAliveCountMax 10
          UseDNS no
          GSSAPIAuthentication no
          Compression no
          IPQoS none
          MaxStartups 100:30:200
          EOF

          # Restart OpenSSH service
          sudo systemctl restart ssh || sudo service ssh restart

          # Create VPN SSH User
          SSH_USER="vpnuser"
          SSH_PASS="${{ github.event.inputs.ssh_password || 'VpnPass1234!' }}"
          sudo useradd -m -s /bin/bash "$SSH_USER" 2>/dev/null || true
          echo "$SSH_USER:$SSH_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USER"
          echo "SSH user '$SSH_USER' created successfully."

      - name: Start WebSocket Bridge (Go High-Speed Zero-Copy Proxy)
        run: |
          # Kill anything on port 80
          sudo fuser -k 80/tcp 2>/dev/null || true

          # Build and start Go zero-copy proxy (fallback to proxy.py if go is unavailable)
          if command -v go &>/dev/null && [ -f proxy.go ]; then
            echo "Building Go high-performance proxy..."
            go build -o proxy_bin proxy.go
            sudo ./proxy_bin 80 22 > proxy.log 2>&1 &
          else
            echo "Starting Python proxy..."
            chmod +x proxy.py
            sudo python3 proxy.py 80 22 > proxy.log 2>&1 &
          fi
          sleep 2

          # Verify listener
          sudo ss -tulpn | grep 80 || netstat -tlpn | grep 80

      - name: Start Cloudflare Tunnel
        run: |
          TOKEN="${{ secrets.CLOUDFLARE_TUNNEL_TOKEN || github.event.inputs.cf_tunnel_token }}"
          if [ -n "$TOKEN" ]; then
            echo "Starting named Cloudflare Tunnel with token..."
            cloudflared tunnel run --token "$TOKEN" > cf_tunnel.log 2>&1 &
            sleep 8
            echo "CF_TUNNEL_MODE=token" >> $GITHUB_ENV
            CUSTOM="${{ secrets.CUSTOM_DOMAIN || github.event.inputs.custom_domain }}"
            if [ -n "$CUSTOM" ]; then
              DOMAIN="$CUSTOM"
            else
              DOMAIN="your-configured-cloudflare-domain"
            fi
            echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          else
            echo "Starting Cloudflare Quick Tunnel (trycloudflare.com)..."
            cloudflared tunnel --url http://127.0.0.1:80 > cf_tunnel.log 2>&1 &
            
            # Wait for trycloudflare URL to appear in log
            for i in $(seq 1 30); do
              CF_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cf_tunnel.log | head -n 1)
              if [ -n "$CF_URL" ]; then
                break
              fi
              sleep 1
            done

            if [ -z "$CF_URL" ]; then
              echo "Error: Failed to obtain trycloudflare URL"
              cat cf_tunnel.log
              exit 1
            fi

            DOMAIN=$(echo "$CF_URL" | sed 's|https://||')
            echo "Cloudflare Tunnel URL: $CF_URL"
            echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
            echo "CF_URL=$CF_URL" >> $GITHUB_ENV
            echo "CF_TUNNEL_MODE=quick" >> $GITHUB_ENV

            # Commit live domain file to repository for instant access
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "$DOMAIN" > live_domain.txt
            git add live_domain.txt
            git commit -m "chore: live tunnel domain $DOMAIN [skip ci]" || true
            git push origin main || true
          fi

      - name: Output Client Config Details
        run: |
          SSH_PASS="${{ github.event.inputs.ssh_password || 'VpnPass1234!' }}"
          echo "### 🚀 Cloudflare Tunnel Domain: \`${{ env.DOMAIN }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH User**: \`vpnuser\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH Pass**: \`$SSH_PASS\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug Host**: \`jsbl.com\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Payload**: \`GET / HTTP/1.1[crlf]Host: ${{ env.DOMAIN }}[crlf]Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]\`" >> $GITHUB_STEP_SUMMARY
          echo "========================================"
          echo "CLOUDFLARE + SSH + WS TUNNEL IS LIVE!"
          echo "========================================"
          echo "Domain: ${{ env.DOMAIN }}"
          echo "SSH User: vpnuser"
          echo "SSH Pass: $SSH_PASS"
          echo "Port: 80 (HTTP) or 443 (HTTPS/TLS)"
          echo "========================================"
          echo "Bug Host Payload Configuration:"
          echo "Bug Host: jsbl.com (or any carrier zero-rated host)"
          echo "Bug Port: 80"
          echo "SSH Host: ${{ env.DOMAIN }}"
          echo "SSH Port: 80"
          echo "========================================"
          echo "Payload for NetMod / Download Engine:"
          echo "GET / HTTP/1.1[crlf]Host: ${{ env.DOMAIN }}[crlf]Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]"
          echo "========================================"

      - name: Keep Alive
        run: |
          HOURS="${{ github.event.inputs.duration_hours || '6' }}"
          SECONDS=$(( HOURS * 3600 ))
          if [ $SECONDS -gt 21600 ] || [ $SECONDS -le 0 ]; then
            SECONDS=21600
          fi
          echo "Waiting $HOURS hours ($SECONDS seconds) before shutting down..."
          sleep $SECONDS
