name: Test SSH + WebSocket Setup
on:
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to keep tunnel alive in hours (1-6)'
        required: true
        default: '6'
        type: string
      custom_domain:
        description: 'Your Cloudflare Public Hostname (e.g. ssh.yourdomain.com) — leave blank to use trycloudflare.com'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup OpenSSH Server
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server

          # Configure OpenSSH daemon
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitTunnel.*/PermitTunnel yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*TCPKeepAlive.*/TCPKeepAlive yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveInterval.*/ClientAliveInterval 15/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ClientAliveCountMax.*/ClientAliveCountMax 10/' /etc/ssh/sshd_config

          sudo mkdir -p /etc/ssh/sshd_config.d
          cat << 'EOF' | sudo tee /etc/ssh/sshd_config.d/99-custom.conf
          PasswordAuthentication yes
          AllowTcpForwarding yes
          GatewayPorts yes
          PermitTunnel yes
          TCPKeepAlive yes
          ClientAliveInterval 15
          ClientAliveCountMax 10
          UseDNS no
          GSSAPIAuthentication no
          Compression no
          MaxStartups 100:30:200
          EOF

          sudo systemctl restart ssh || sudo service ssh restart

          # Abort if SSH_PASSWORD secret is not set
          if [ -z "$SSH_PASS" ]; then
            echo "ERROR: SSH_PASSWORD secret is not set. Add it under Settings > Secrets > Actions."
            exit 1
          fi

          SSH_USER="vpnuser"
          sudo useradd -m -s /bin/bash "$SSH_USER" 2>/dev/null || true
          echo "$SSH_USER:$SSH_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USER"
          echo "SSH user created."

      - name: Tune TCP Stack for High-Throughput / High-Latency (BDP Optimized)
        run: |
          # Max socket buffer: 16MB (allows auto-tuning up to full BDP)
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216

          # TCP auto-tuning range: min=4KB, default=2MB, max=16MB
          sudo sysctl -w net.ipv4.tcp_rmem="4096 2097152 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 2097152 16777216"

          # BBR congestion control — built for high-latency, high-BDP links
          sudo modprobe tcp_bbr 2>/dev/null || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true

          # TCP Fast Open: saves 1 full RTT on new connections
          sudo sysctl -w net.ipv4.tcp_fastopen=3

          # Disable delayed ACK
          sudo sysctl -w net.ipv4.tcp_low_latency=1 || true

          # Increase backlog to absorb bursts
          sudo sysctl -w net.core.netdev_max_backlog=5000
          sudo sysctl -w net.core.somaxconn=4096

          # Disable TCP slow-start after idle — keeps window open on bursty 4G
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0

          echo "BBR active: $(cat /proc/sys/net/ipv4/tcp_congestion_control)"

      - name: Start WebSocket Bridge (Go Zero-Copy Proxy)
        run: |
          sudo fuser -k 80/tcp 2>/dev/null || true

          if command -v go &>/dev/null && [ -f proxy.go ]; then
            go build -o proxy_bin proxy.go
            sudo ./proxy_bin 80 22 > /dev/null 2>&1 &
          else
            chmod +x proxy.py
            sudo python3 proxy.py 80 22 > /dev/null 2>&1 &
          fi
          sleep 2
          sudo ss -tulpn | grep ':80' || true

      - name: Start Cloudflare Tunnel
        run: |
          TOKEN="${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            cloudflared tunnel run --token "$TOKEN" > /dev/null 2>&1 &
            sleep 8
            CUSTOM="${{ secrets.CUSTOM_DOMAIN }}"
            if [ -n "$CUSTOM" ]; then
              DOMAIN="$CUSTOM"
            else
              DOMAIN="your-configured-cloudflare-domain"
            fi
            echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          else
            cloudflared tunnel --url http://127.0.0.1:80 > cf_tunnel.log 2>&1 &

            for i in $(seq 1 30); do
              CF_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cf_tunnel.log | head -n 1)
              if [ -n "$CF_URL" ]; then break; fi
              sleep 1
            done

            if [ -z "$CF_URL" ]; then
              echo "Failed to obtain trycloudflare URL"
              exit 1
            fi

            DOMAIN=$(echo "$CF_URL" | sed 's|https://||')
            echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "$DOMAIN" > live_domain.txt
            git add live_domain.txt
            git commit -m "chore: update live domain [skip ci]" || true
            git push origin main || true
          fi

      - name: Tunnel Ready
        run: |
          echo "Tunnel is live on domain: ${{ env.DOMAIN }}"

      - name: Keep Alive
        run: |
          HOURS="${{ github.event.inputs.duration_hours || '6' }}"
          SECONDS=$(( HOURS * 3600 ))
          if [ $SECONDS -gt 21600 ] || [ $SECONDS -le 0 ]; then
            SECONDS=21600
          fi
          sleep $SECONDS
